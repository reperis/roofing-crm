# The same gate `just check` runs locally, on every push and pull request.
#
# It deliberately needs no secrets. Formatting, types, tests and the site build all run against the
# repository alone — the staged Oracle dataset is gitignored and the build tolerates its absence — so a fork can
# run this without any access to AWS, the Oracle runtime or the deployed site.
#
# The steps are split rather than run as one command so a failure names itself in the Actions UI.
# The commands themselves live in package.json, which is also all `just check` calls — neither side
# defines what "checked" means, so the two cannot drift.
name: check

on:
  push:
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same ref; nothing is learned from finishing the
  # older one.
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Majors kept current deliberately: v4 of these targets Node 20, which GitHub has
      # deprecated and now force-runs on Node 24. Pinning to a runtime the platform is retiring
      # is a build that breaks on someone else's schedule.
      - uses: actions/checkout@v5

      # No version pinned here: the action reads `packageManager` from package.json, so the lockfile
      # and CI can never disagree about which pnpm produced it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # matches `engines.node`
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Thresholds are set at the suite's measured coverage, so this fails when coverage slips
      # rather than when it fails to reach a number nobody chose.
      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
