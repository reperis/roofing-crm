packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Vite's bundler; its postinstall fetches the platform-native binary. Without this the binary
  # never installs and every `vite build` fails on a missing esbuild executable.
  esbuild: true
# Populated as dependencies are added. The workspace enforces a minimum release age, so any
# package published more recently than the threshold has to be named here deliberately rather
# than pulled in silently.
minimumReleaseAgeExclude:
  - eslint@10.9.0
  - maplibre-gl@6.5.0
  - '@aws-sdk/client-dynamodb@3.1116.0'
  - '@aws-sdk/client-ssm@3.1116.0'
  - '@aws-sdk/core@3.977.9'
  - '@aws-sdk/credential-provider-env@3.972.70'
  - '@aws-sdk/credential-provider-http@3.972.72'
  - '@aws-sdk/credential-provider-ini@3.973.15'
  - '@aws-sdk/credential-provider-login@3.972.77'
  - '@aws-sdk/credential-provider-node@3.972.81'
  - '@aws-sdk/credential-provider-process@3.972.70'
  - '@aws-sdk/credential-provider-sso@3.973.14'
  - '@aws-sdk/credential-provider-web-identity@3.972.76'
  - '@aws-sdk/dynamodb-codec@3.973.44'
  - '@aws-sdk/lib-dynamodb@3.1116.0'
  - '@aws-sdk/middleware-endpoint-discovery@3.972.30'
  - '@aws-sdk/nested-clients@3.997.44'
  - '@aws-sdk/signature-v4-multi-region@3.996.46'
  - '@aws-sdk/token-providers@3.1116.0'
  - '@aws-sdk/types@3.974.5'
  - '@aws-sdk/xml-builder@3.972.40'
  - '@ai-sdk/anthropic@4.0.41'
  - '@ai-sdk/gateway@4.0.62'
  - '@ai-sdk/provider-utils@5.0.29'
  - '@aws-sdk/checksums@3.1000.29'
  - '@aws-sdk/client-s3@3.1116.0'
  - '@aws-sdk/middleware-sdk-s3@3.972.75'
  - ai@7.0.77
